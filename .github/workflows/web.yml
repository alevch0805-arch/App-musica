# Publica la app web en la rama «gh-pages», que GitHub Pages muestra como página pública:
#   https://<usuario>.github.io/<repositorio>/
#
# Una sola vez, en el repositorio: Settings → Pages → «Build and deployment» →
# Source: «Deploy from a branch» → Branch: «gh-pages» y carpeta «/ (root)» → Save.
name: Página web

on:
  workflow_dispatch:
  push:
    branches: ['claude/music-hymn-app-f42pk4']

permissions:
  contents: write

concurrency:
  group: pagina-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Compilar la web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicar la web'
