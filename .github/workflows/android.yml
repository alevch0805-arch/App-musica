# Compila la app de Android (APK) en los servidores de GitHub.
#
# Cómo usarlo: pestaña "Actions" del repositorio → "APK de Android" → "Run workflow".
# Al terminar, el APK está en la sección "Artifacts" de esa ejecución.
# Si creas una etiqueta vX.Y.Z (p. ej. v1.0.0), además se publica en "Releases".
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   → datos de tu proyecto de Supabase
#   (sin ellos, la app funciona en «modo demo»: sin cuentas, con himnarios importados en el teléfono)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD      → clave de firma (ver README)
name: APK de Android

on:
  workflow_dispatch:
  push:
    branches: ['claude/music-hymn-app-f42pk4']
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test

      - name: Compilar la web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - run: npx cap sync android

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/himnos.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/himnos.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No hay clave de firma (ANDROID_KEYSTORE_BASE64). Se genera un APK de prueba que NO se podrá actualizar encima de versiones anteriores."
          fi

      - name: Compilar el APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/himnos.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/himnos.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: himnos-apk
          path: himnos.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Himnos y acordes ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Descarga **himnos.apk** (abajo, en «Assets») desde el teléfono Android y ábrelo para instalarlo.
            Si el teléfono lo pide, permite «instalar apps de origen desconocido».

            Enlace fijo a la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/himnos.apk
          files: himnos.apk
