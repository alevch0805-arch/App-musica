<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Video</title>
<style>
  :root { --bg:#0e0b16; --panel:#1a1526; --text:#f3eefc; --muted:#a59cb8; --accent:#ff3d9a; --accent2:#5ad1ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 16px; }
  .panel { background:var(--panel); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:8px 0 4px; }
  input[type=file], textarea { width:100%; }
  textarea { min-height:140px; background:#120e1c; color:var(--text); border:1px solid #2e2640; border-radius:8px; padding:8px; font-family:ui-monospace,monospace; font-size:.85rem; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; }
  button.secondary { background:#2e2640; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  canvas { width:100%; aspect-ratio:16/9; display:block; border-radius:12px; background:#000; }
  audio { width:100%; margin-top:10px; }
  #status { font-size:.9rem; color:var(--accent2); min-height:1.2em; margin-top:8px; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🎤 Audio → Video Karaoke</h1>

  <section class="panel">
    <label>1. Elige tus archivos de audio (puedes seleccionar varios o una carpeta; se busca automáticamente "kametra")</label>
    <input id="audioFiles" type="file" accept="audio/*,video/*" multiple>
    <label>2. Letra: carga un archivo .lrc / .txt o pégala abajo</label>
    <input id="lyricsFile" type="file" accept=".lrc,.txt,text/plain">
    <textarea id="lyrics" placeholder="[00:12.30] Primera línea de la canción&#10;[00:16.80] Segunda línea...&#10;&#10;Si pegas la letra SIN tiempos, usa 'Sincronizar' y pulsa ESPACIO al inicio de cada línea."></textarea>
    <div class="row">
      <button id="applyBtn" class="secondary">Aplicar letra</button>
      <button id="syncBtn" class="secondary">Sincronizar (ESPACIO)</button>
      <button id="copyLrcBtn" class="secondary">Copiar como .lrc</button>
    </div>
    <div id="status"></div>
  </section>

  <section class="panel">
    <canvas id="stage" width="1280" height="720"></canvas>
    <audio id="audio" controls></audio>
    <div class="row">
      <button id="playBtn" disabled>▶ Reproducir karaoke</button>
      <button id="recordBtn" disabled>⏺ Exportar video (.webm)</button>
    </div>
    <small>La exportación graba el video en tiempo real mientras suena la canción y lo descarga al terminar.</small>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio'), canvas = $('stage'), ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
let lines = [];            // [{t, text}]
let songTitle = '';
let audioCtx, analyser, srcNode, streamDest, freq;
let syncing = false, syncIdx = 0, rawSyncLines = [];

const status = msg => $('status').textContent = msg;

/* ---------- Audio: buscar "kametra" ---------- */
$('audioFiles').addEventListener('change', e => {
  const files = [...e.target.files];
  if (!files.length) return;
  const match = files.find(f => /kametra/i.test(f.name));
  const file = match || files[0];
  songTitle = file.name.replace(/\.[^.]+$/, '');
  audio.src = URL.createObjectURL(file);
  $('playBtn').disabled = $('recordBtn').disabled = false;
  status(match ? `✔ Encontrado: "${file.name}"`
               : `⚠ No se encontró "kametra" entre ${files.length} archivo(s); usando "${file.name}"`);
});

/* ---------- Letra ---------- */
$('lyricsFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('lyrics').value = await f.text();
  applyLyrics();
});
$('applyBtn').onclick = applyLyrics;

function parseLRC(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    if (!tags.length) continue;
    const txt = raw.replace(/\[[^\]]*\]/g, '').trim();
    for (const m of tags) out.push({ t: +m[1] * 60 + parseFloat(m[2].replace(':', '.')), text: txt });
  }
  return out.sort((a, b) => a.t - b.t);
}

function applyLyrics() {
  const text = $('lyrics').value;
  const parsed = parseLRC(text);
  if (parsed.length) { lines = parsed; status(`Letra cargada: ${lines.length} líneas con tiempos.`); return; }
  rawSyncLines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  lines = [];
  status(rawSyncLines.length ? `La letra no tiene tiempos (${rawSyncLines.length} líneas). Pulsa "Sincronizar".` : 'No hay letra.');
}

/* ---------- Sincronización manual ---------- */
$('syncBtn').onclick = () => {
  applyLyrics();
  if (lines.length) { status('La letra ya tiene tiempos.'); return; }
  if (!rawSyncLines.length || !audio.src) { status('Carga el audio y pega la letra primero.'); return; }
  syncing = true; syncIdx = 0; lines = [];
  ensureAudioGraph(); audio.currentTime = 0; audio.play();
  status(`Sincronizando… pulsa ESPACIO cuando empiece: "${rawSyncLines[0]}"`);
};
document.addEventListener('keydown', e => {
  if (!syncing || e.code !== 'Space') return;
  e.preventDefault();
  lines.push({ t: audio.currentTime, text: rawSyncLines[syncIdx++] });
  if (syncIdx >= rawSyncLines.length) {
    syncing = false;
    $('lyrics').value = toLRC();
    status('✔ Sincronización terminada. La letra se convirtió a formato .lrc.');
  } else status(`Siguiente: "${rawSyncLines[syncIdx]}"`);
});
const fmt = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${(t % 60).toFixed(2).padStart(5, '0')}`;
const toLRC = () => lines.map(l => `[${fmt(l.t)}] ${l.text}`).join('\n');
$('copyLrcBtn').onclick = () => { navigator.clipboard?.writeText(toLRC()); status('LRC copiado.'); };

/* ---------- Audio graph (visualizador + grabación) ---------- */
function ensureAudioGraph() {
  if (audioCtx) { audioCtx.resume(); return; }
  audioCtx = new AudioContext();
  srcNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
  freq = new Uint8Array(analyser.frequencyBinCount);
  streamDest = audioCtx.createMediaStreamDestination();
  srcNode.connect(analyser); analyser.connect(audioCtx.destination); srcNode.connect(streamDest);
}

$('playBtn').onclick = () => { if (!lines.length) applyLyrics(); ensureAudioGraph(); audio.currentTime = 0; audio.play(); };

/* ---------- Render karaoke ---------- */
function currentIndex(t) {
  let i = -1;
  for (let k = 0; k < lines.length; k++) { if (lines[k].t <= t) i = k; else break; }
  return i;
}

function wrapFont(text, maxW, size) {
  ctx.font = `800 ${size}px system-ui, sans-serif`;
  while (ctx.measureText(text).width > maxW && size > 24) { size -= 2; ctx.font = `800 ${size}px system-ui, sans-serif`; }
  return size;
}

function drawLine(text, y, size, progress, active) {
  size = wrapFont(text, W * 0.9, size);
  const w = ctx.measureText(text).width, x = (W - w) / 2;
  ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 8; ctx.strokeStyle = 'rgba(0,0,0,.75)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = active ? '#ffffff' : 'rgba(255,255,255,.45)';
  ctx.fillText(text, x, y);
  if (active && progress > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y - size, w * progress, size * 2); ctx.clip();
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#ff3d9a'); g.addColorStop(1, '#5ad1ff');
    ctx.fillStyle = g; ctx.fillText(text, x, y);
    ctx.restore();
  }
}

function render() {
  const t = audio.currentTime;
  // Fondo
  const hue = (t * 8) % 360;
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, `hsl(${hue},60%,12%)`); bg.addColorStop(1, `hsl(${(hue + 60) % 360},60%,6%)`);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Visualizador
  if (analyser) {
    analyser.getByteFrequencyData(freq);
    const n = freq.length, bw = W / n;
    for (let i = 0; i < n; i++) {
      const h = (freq[i] / 255) * H * 0.35;
      ctx.fillStyle = `hsla(${(hue + i * 2) % 360},90%,60%,.35)`;
      ctx.fillRect(i * bw, H - h, bw - 2, h);
    }
  }

  // Título
  ctx.font = '600 28px system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.textBaseline = 'top';
  ctx.fillText(songTitle || 'Karaoke', 32, 28);

  // Letra
  if (lines.length) {
    const i = currentIndex(t);
    if (i < 0) {
      const wait = lines[0].t - t;
      drawLine(wait > 3 ? '♪ ♪ ♪' : '● '.repeat(Math.ceil(wait)).trim(), H * 0.42, 64, 0, false);
      drawLine(lines[0].text, H * 0.58, 52, 0, false);
    } else {
      const cur = lines[i], next = lines[i + 1];
      const end = next ? next.t : (audio.duration || cur.t + 5);
      const dur = Math.max(0.3, Math.min(end - cur.t, Math.max(2, cur.text.length * 0.12) + 1));
      const p = Math.min(1, (t - cur.t) / (dur * 0.9));
      if (lines[i - 1]) drawLine(lines[i - 1].text, H * 0.28, 40, 0, false);
      drawLine(cur.text || '♪', H * 0.45, 68, p, true);
      if (next) drawLine(next.text, H * 0.62, 48, 0, false);
      if (lines[i + 2]) drawLine(lines[i + 2].text, H * 0.75, 38, 0, false);
    }
  } else {
    drawLine('Carga el audio y la letra', H * 0.5, 56, 0, false);
  }
  requestAnimationFrame(render);
}
render();

/* ---------- Exportar video ---------- */
$('recordBtn').onclick = () => {
  if (!lines.length) applyLyrics();
  ensureAudioGraph();
  const stream = new MediaStream([...canvas.captureStream(30).getVideoTracks(), ...streamDest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = `${songTitle || 'karaoke'}.webm`; a.click();
    $('recordBtn').disabled = false; status('✔ Video exportado.');
  };
  audio.onended = () => rec.state === 'recording' && rec.stop();
  audio.currentTime = 0;
  rec.start(1000); audio.play();
  $('recordBtn').disabled = true;
  status('⏺ Grabando video… espera a que termine la canción.');
};
</script>
</body>
</html>
